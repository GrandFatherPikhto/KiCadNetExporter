# Готовый конфиг под твой текущий проект (адаптация старого config.yaml).
# Пути возьми свои, если проект переехал.

projects:
  - name: 3CH-AWG-TIA-v101
    kicad_project: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v101/3CH-AWG-TIA.kicad_pro"
    netlist: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v101/3CH-AWG-TIA.net"
    output_dir: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v101/out"
  - name: 3CH-AWG-TIA-v102
    kicad_project: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v102/3CH-AWG-TIA-v102.kicad_pro"
    netlist: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v102/3CH-AWG-TIA-v102.net"
    output_dir: "D:/Projects/KiCad/3CH-AWG-TIA/3CH-AWG-TIA-v102/out"
  - name: ADA4870-Exciter
    kicad_project: "D:/Projects/KiCad/3CH-AWG-TIA/ADA4807-Exciter/ADA4807-Exciter.kicad_pro"
    netlist: "D:/Projects/KiCad/3CH-AWG-TIA/ADA4807-Exciter/ADA4807-Exciter.net"
    output_dir: "D:/Projects/KiCad/3CH-AWG-TIA/ADA4807-Exciter/out"

output:
  formats: [txt, json]
  raw_txt_copy: false
  diff: true

classification:
  power_patterns:
    - "(?i)^GND$"
    - "(?i)^\\+?\\d+V\\d*"
    - "(?i)VCC|VDD|VEE|VSS"
  suspicious_patterns:
    - "(?i)net-\\("
    - "(?i)[+-]\\d+v"
    - "(?i)clk|clock"
    - "(?i)pwr|vcc|vdd|vee"

watch:
  enabled: true
  debounce_sec: 1.0
  settle_delay_sec: 0.2

logging:
  level: INFO
  file: "kicad_net_exporter.log"
  max_bytes: 1048576
  backup_count: 3
  console: true

tray:
  enabled: true
